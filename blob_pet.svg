<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 312 273" width="312" height="273">
<style>
  .teddy-waddle { animation: teddy-waddle 1.6s ease-in-out infinite; transform-origin: center bottom; }
  @keyframes teddy-waddle {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25%      { transform: translateY(-3px) rotate(-2deg); }
    50%      { transform: translateY(-6px) rotate(0deg); }
    75%      { transform: translateY(-3px) rotate(2deg); }
  }
  .teddy-heart { animation: teddy-heart-pulse 1.4s ease-in-out infinite; transform-origin: center; }
  @keyframes teddy-heart-pulse {
    0%, 100% { transform: scale(1) translateY(0); opacity: 0.9; }
    50%      { transform: scale(1.15) translateY(-3px); opacity: 1; }
  }
</style>
