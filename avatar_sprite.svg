<style>
  .sprite-bob {
    animation: sprite-bob 2.2s ease-in-out infinite;
    transform-origin: center bottom;
  }
  @keyframes sprite-bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .prop-cam { animation: prop-cam-cycle 6s steps(1) infinite; }
  .prop-jar { animation: prop-jar-cycle 6s steps(1) infinite; }
  @keyframes prop-cam-cycle {
    0%   { opacity: 1; }
    49%  { opacity: 1; }
    50%  { opacity: 0; }
    99%  { opacity: 0; }
    100% { opacity: 1; }
  }
  @keyframes prop-jar-cycle {
    0%   { opacity: 0; }
    49%  { opacity: 0; }
    50%  { opacity: 1; }
    99%  { opacity: 1; }
    100% { opacity: 0; }
  }
</style>
